<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName vera.example.com
  ServerAlias vera.example.com
  ServerAdmin contributor@example.com

  ErrorLog ${APACHE_LOG_DIR}/vera-error.log
  CustomLog ${APACHE_LOG_DIR}/vera-access.log combined

  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set Host "vera.example.com"

  Header set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
  Header set X-XSS-Protection "1; mode=block"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin"
  Header always set Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()"
  Header always set Content-Security-Policy "script-src 'self'"

  <Proxy *>
    Order deny,allow
    Allow from all
  </Proxy>

  ProxyPass / http://localhost:4256/
  ProxyPassReverse / http://localhost:4256/

  SSLEngine on
  SSLProtocol -all +TLSv1.2
  SSLHonorCipherOrder on
  SSLCipherSuite EECDH+AESGCM:AES256+EECDH:AES128+EECDH

  SSLCertificateFile /etc/letsencrypt/live/vera.example.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/vera.example.com/privkey.pem
</VirtualHost>
</IfModule>

<VirtualHost *:80>
  ServerAdmin contributor@example.com
  ServerName vera.example.com
  Redirect Permanent / https://vera.example.com
</VirtualHost>
